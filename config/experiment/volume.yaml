# @package _global_

# Fine-tuning on volume-rendered scenes (256x256, black background, cameras around the volume).
# The encoder settings are those of the base DL3DV model (depthsplat-gs-base-dl3dv-256x448-randview2-6), the
# checkpoint to start from; change them together with checkpointing.pretrained_model.

defaults:
  - override /dataset: volume
  - override /model/encoder: depthsplat
  - override /loss: [mse, lpips]
  - override /dataset/view_sampler: even

wandb:
  name: volume
  tags: [volume, 256x256]

data_loader:
  train:
    batch_size: 1

trainer:
  max_steps: 100_001
  num_nodes: 1

model:
  encoder:
    num_depth_candidates: 128
    costvolume_unet_feat_dim: 128
    costvolume_unet_channel_mult: [1,1,1]
    costvolume_unet_attn_res: [4]
    gaussians_per_pixel: 1
    depth_unet_feat_dim: 32
    depth_unet_attn_res: [16]
    depth_unet_channel_mult: [1,1,1,1,1]
    shim_patch_size: 16
    num_scales: 2
    upsample_factor: 4
    lowest_feature_resolution: 8
    monodepth_vit_type: vitb

# lpips loss
loss:
  lpips:
    apply_after_step: 0
    weight: 0.05

dataset:
  image_shape: [256, 256]
  k: 1.0
  bounds: tight
  view_sampler:
    num_context_views: 6
    num_target_views: 4

train:
  # the full test-set evaluation inside the training loop only knows the RE10K / DL3DV index files
  eval_model_every_n_val: 0
  # the validation videos interpolate between the first two context views, which are far apart here
  no_viz_video: true
